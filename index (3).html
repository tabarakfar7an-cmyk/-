<title>بطل السهرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: one narrow column passed around a circle of people; big touch targets, one screen per moment (setup, level intro, level, standings). */
:root{
  --bg:#F2F3F9;
  --surface:#FFFFFF;
  --ink:#1A1F3D;
  --muted:#5B6285;
  --line:#D9DCEA;
  --chip:#E7EAF7;
  --accent:#F0A30A;
  --accent-ink:#1A1F3D;
  --good:#1E8E5A;
  --bad:#C8402F;
  --font-display:'Lalezar','Tajawal','Segoe UI',Tahoma,sans-serif;
  --font-body:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12162B;--surface:#1C2242;--ink:#EEF0FA;--muted:#A3AAD0;--line:#2E3566;--chip:#262D58;
    --accent:#F5B332;--accent-ink:#12162B;--good:#4CC58C;--bad:#F0786A;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12162B;--surface:#1C2242;--ink:#EEF0FA;--muted:#A3AAD0;--line:#2E3566;--chip:#262D58;
  --accent:#F5B332;--accent-ink:#12162B;--good:#4CC58C;--bad:#F0786A;color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.6;
  padding-block:20px 90px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:640px;margin-inline:auto}
main{display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p,ul,ol{margin:0}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(52px,16vw,88px);line-height:1.05;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:400;font-size:1.7rem;line-height:1.25;text-wrap:balance}
h3{font-size:1.05rem;font-weight:800}
.eyebrow{font-size:.85rem;font-weight:800;letter-spacing:.04em;color:var(--muted)}
.lead{color:var(--muted);max-width:60ch}
.muted{color:var(--muted);font-size:.95rem}
.hero{display:flex;flex-direction:column;gap:10px;padding-block:8px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.btn{font:inherit;font-weight:800;min-height:48px;padding:10px 18px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;position:relative;display:inline-flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}

function newRound(){
  var left=[];for(var i=0;i<RULES.length;i++){if(L.used.indexOf(i)<0)left.push(i);}
  if(!left.length){L.used=[];for(var j=0;j<RULES.length;j++)left.push(j);}
  L.rule=pick(left);L.used.push(L.rule);
  var n=S.players.length;var k=Math.floor(Math.random()*n);
  if(n>1&&k===L.keeper){k=(k+1)%n;}
  L.keeper=k;L.show=false;
}

/* ---------- rendering ---------- */
function progressHTML(){
  var s='<div class="prog" aria-label="الليفل '+(S.level+1)+' من 10">';
  for(var i=0;i<10;i++){s+='<i style="--pc:'+LC[i]+'" class="'+(i<S.level?'done':(i===S.level&&S.screen==='play'?'cur':''))+'"></i>';}
  return s+'</div>';
}
function standingsHTML(title){
  var arr=S.players.slice().sort(function(a,b){return b.score-a.score;});
  var rank=0,prev=null;
  var rows=arr.map(function(p,i){
    if(p.score!==prev){rank=i+1;prev=p.score;}
    return '<li style="--h:'+p.h+'" class="'+(rank===1?'lead':'')+'"><span class="rk">'+rank+'</span>'+av(p)+'<span class="sname">'+esc(p.name)+(rank===1?' 👑':'')+'</span><span class="spts">'+p.score+'</span></li>';
  }).join('');
  return '<section class="card"><h2>'+esc(title)+'</h2><ol class="stand">'+rows+'</ol></section>';
}

function drawScores(){
  var sp=$('#sp');if(!sp)return;
  var incs=LEVELS[S.level].inc;
  sp.innerHTML=S.players.map(function(p){
    return '<div class="srow">'+av(p)+'<span class="sname">'+esc(p.name)+'</span><span class="spts">'+p.score+'</span><span class="sbtns"><button class="sb neg" data-act="score" data-id="'+p.id+'" data-d="-1" aria-label="اطرح نقطة من '+esc(p.name)+'">−1</button>'+
     incs.map(function(d){return '<button class="sb pos" data-act="score" data-id="'+p.id+'" data-d="'+d+'" aria-label="أضف '+d+' لـ '+esc(p.name)+'">+'+d+'</button>';}).join('')+'</span></div>';
  }).join('');
}
function renderFinal(){setTimeout(function(){snd('fan');confetti(220);},250);
  var max=-Infinity;S.players.forEach(function(p){if(p.score>max)max=p.score;});
  var w=S.players.filter(function(p){return p.score===max;}).map(function(p){return p.name;});
  var head=w.length===1?'<p class="eyebrow">بطل السهرة</p>'+avBig(S.players.filter(function(p){return p.score===max;})[0])+'<p class="winner">'+esc(w[0])+'</p>':'<p class="eyebrow">تعادل بين</p><p class="winner">'+w.map(esc).join(' و ')+'</p><p class="muted">اعملوا جولة فاصلة: الجريمة الغامضة بقضية جديدة أو عدّ تنازلي سريع.</p>';
  app.innerHTML=progressHTML()+'<section class="card">'+head+'</section>'+standingsHTML('الترتيب النهائي')+
  '<div class="row2"><button class="btn primary" data-act="again">نفس اللاعبين</button><button class="btn" data-act="newp">لاعبين جدد</button></div>';
}
function render(){
  stopTimer();theme();stopRec();
  if(S.screen==='setup')renderSetup();
  else if(S.screen==='intro')renderIntro();
  else if(S.screen==='play')renderPlay();
  else renderFinal();
  try{window.scrollTo(0,0);}catch(e){}
}

/* ---------- audio ---------- */
function playClip(id){
  var c=L.clips&&L.clips[id];if(!c)return;
  var a=new Audio(c.url);
  var p=a.play();
  if(p&&p.catch){p.catch(function(){
    var r=new FileReader();
    r.onload=function(){var b=new Audio(r.result);var q=b.play();if(q&&q.catch)q.catch(function(){toast('الجهاز ما قدر يشغّل هالملف');});};
    r.readAsDataURL(c.file);
  });}
}
function dropClips(){
  if(!L.clips)return;
  Object.keys(L.clips).forEach(function(k){try{URL.revokeObjectURL(L.clips[k].url);}catch(e){}});
}

/* ---------- actions ---------- */
function award(fn,msg){fn();drawScores();toast(msg);snd('win');confetti(70);}
function finishLevel(){
  clearTimeout(L.cet);dropClips();S.level++;
  S.screen=S.level>=10?'final':'intro';render();
}
function act(a,b){
  var id=Number(b.dataset.id);
  switch(a){
   case 'rnd':pickPlayer();break;
   case 'pkx':closePk();break;
   case 'rm':S.players=S.players.filter(function(p){return p.id!==id;});drawList();break;
   case 'go':
    if(S.players.length<2){toast('أضيفوا لاعبين اثنين على الأقل');break;}
    S.level=0;S.screen='intro';render();break;
   case 'startlevel':
    S.screen='play';L={};LEVELS[S.level].init();render();break;
   case 'score':
    var p=byId(id);if(p){p.score+=Number(b.dataset.d);drawScores();if(Number(b.dataset.d)>0)snd('win');}break;
   case 'timer':startTimer(Number(b.dataset.s));break;
   case 'endlevel':
    if(!L.ce){
     L.ce=true;b.textContent='اضغط مرة ثانية لإنهاء الليفل';
     clearTimeout(L.cet);L.cet=setTimeout(function(){L.ce=false;b.textContent='انتهى الليفل';},3500);
    }else{finishLevel();}
    break;
   case 'dealshow':L.deal.shown=true;drawStage();break;
   case 'dealhide':L.deal.shown=false;L.deal.i++;if(L.deal.i>=S.players.length){L.deal.done=true;}drawStage();break;
   case 'again':
    S.players.forEach(function(p){p.score=0;});S.level=0;S.screen='intro';render();break;
   case 'newp':S.players=[];S.level=0;S.screen='setup';render();break;
   /* level 1 */
   case 'l1rec':if(recS&&recS.id===id){stopRec();}else if(recS){toast('أوقف التسجيل الحالي أول');}else{startRec(id);}break;
   case 'l1try':playClip(id);break;
   case 'l1start':L.queue=shuffle(Object.keys(L.clips).map(Number));L.i=0;L.rev=false;L.phase='guess';drawStage();break;
   case 'l1play':playClip(id);break;
   case 'l1rev':L.rev=true;drawStage();break;
   case 'l1next':L.i++;L.rev=false;drawStage();break;
   /* level 2 */
   case 'l2show':L.show=!L.show;drawStage();break;
   case 'l2new':stopTimer();L.t=undefined;L.ch=pick(CH);L.show=false;drawStage();break;
   case 'l2next':stopTimer();L.t=undefined;L.turn++;L.ch=pick(CH);L.show=false;drawStage();break;
   /* level 3 */
   case 'l3txt':L.txt=!L.txt;drawStage();break;
   case 'l3err':L.err=!L.err;drawStage();break;
   case 'l3new':L.k++;L.txt=false;L.err=false;drawStage();break;
   /* level 4 */
   case 'l4show':L.show=!L.show;drawStage();break;
   case 'l4new':newRound();drawStage();break;
   /* level 5 */
   case 'l5n':L.nsp=Math.max(1,Math.min(S.players.length-1||1,L.nsp+Number(b.dataset.d)));drawStage();break;
   case 'l5go':L.spies=shuffle(S.players.map(function(p,i){return i;})).slice(0,L.nsp);L.mk();L.cfg=false;drawStage();break;
   case 'l5rev':L.rev=true;drawStage();break;
   case 'l5caught':
    if(L.aw)break;L.aw=true;
    award(function(){S.players.forEach(function(p,i){if(L.spies.indexOf(i)<0)p.score+=1;});},'+1 لكل واحد غير الجاسوس');drawStage();break;
   case 'l5escape':
    if(L.aw)break;L.aw=true;
    award(function(){L.spies.forEach(function(i){S.players[i].score+=2;});},'+2 للجاسوس أو الجواسيس');drawStage();break;
   /* level 6 */
   case 'l6topic':L.topic=pick(TOPICS.filter(function(t){return t!==L.topic;}));drawStage();break;
   case 'l6rev':L.rev=true;drawStage();break;
   /* level 7 */
   case 'l7check':L.chk=true;drawStage();break;
   case 'l7ok':
    if(L.aw)break;L.aw=true;
    award(function(){S.players.forEach(function(p){p.score+=1;});},'+1 للكل');drawStage();break;
   /* level 8 */
   case 'l8ideas':L.ideas=shuffle(IDEAS).slice(0,chg()+2);drawStage();break;
   case 'l8next':stopTimer();L.t=undefined;L.turn++;L.ideas=shuffle(IDEAS).slice(0,chg()+2);drawStage();break;
   /* level 9 */
   case 'l9right':
    if(L.aw)break;L.aw=true;
    award(function(){var t=L.turn%S.players.length;S.players.forEach(function(p,i){if(i!==t)p.score+=1;});},'+1 لكل الباقي');drawStage();break;
   case 'l9fooled':
    if(L.aw)break;L.aw=true;
    award(function(){S.players[L.turn%S.players.length].score+=1;},'+1 للراوي');drawStage();break;
   case 'l9topic':L.topic=pick(TELL.filter(function(t){return t!==L.topic;}));drawStage();break;
   case 'l9next':stopTimer();L.t=undefined;L.turn++;L.topic=pick(TELL);L.aw=false;drawStage();break;
   /* level 10 */
   case 'l10deal':
    var n=S.players.length;var cl=shuffle(L.cs.c);var items=[];
    for(var i=0;i<n;i++){
     var mine=[];
     if(n<=cl.length){for(var j=i;j<cl.length;j+=n){mine.push(cl[j]);}}
     else{mine.push(cl[i%cl.length]);}
     items.push('تلميحك<br>'+mine.map(function(x){return '<span class="task">'+esc(x)+'</span>';}).join('<br><br>'));
    }
    L.started=true;dealInit(items);drawStage();break;
   case 'l10sol':L.sol=true;drawStage();break;
  }
}

document.addEventListener('click',function(e){
  var fl=e.target.closest?e.target.closest('.flip'):null;
  if(fl){fl.classList.toggle('on');snd('flip');return;}
  var b=e.target.closest?e.target.closest('[data-act]'):null;
  if(!b||b.disabled)return;
  if(b.dataset.act!=='score')snd('tap');
  act(b.dataset.act,b);
});
document.addEventListener('submit',function(e){
  if(!e.target||e.target.id!=='addf')return;
  e.preventDefault();
  var inp=$('#nm');var name=inp.value.replace(/\s+/g,' ').trim();
  if(!name){toast('اكتب اسم اللاعب');return;}
  var q=S.nextId++;S.players.push({id:q,name:name,score:0,a:AV[(q-1)%AV.length],h:HUES[(q-1)%HUES.length]});
  inp.value='';drawList();inp.focus();
});
document.addEventListener('change',function(e){
  var f=e.target;
  if(!f||!f.matches||!f.matches('input[data-clip]')||!f.files||!f.files[0])return;
  var id=Number(f.dataset.clip);
  if(L.clips[id]){try{URL.revokeObjectURL(L.clips[id].url);}catch(x){}}
  L.clips[id]={file:f.files[0],url:URL.createObjectURL(f.files[0])};
  drawStage();
  toast('تم حفظ صوت '+byId(id).name);
});

render();
})();
</script>

</body></html>
